<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coptic Kids Learning Soundboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- QUIZ TAB (always visible) -->
<div class="quiz-tab">
    <button id="quizBtn" onclick="openQuiz()">🏆 Quiz</button>
</div>

<!-- ============ SOUNDBOARD PAGE ============ -->
<div id="soundboard-page">
    <h1>🎵 Coptic Kids Soundboard<br><span>✨ Tap the letters & learn! ✨</span></h1>
    
    <div class="grid-container" id="soundboard-grid">
        <!-- cards will be generated by JS -->
    </div>
</div>

<!-- ============ QUIZ PAGE ============ -->
<div id="quiz-page">
    <div class="quiz-header">🏆 Letter Quiz</div>
    <div class="question-number" id="qNumber">Question 1 of 5</div>
    
    <div class="sound-instruction">Listen carefully, then choose the correct letter:</div>
    
    <button class="play-sound-btn" id="playSoundBtn" onclick="playCurrentSound()">
        🔊 Play Sound
    </button>
    
    <div class="choices-grid" id="choicesGrid">
        <!-- 3 choice cards will be inserted here -->
    </div>
    
    <div class="result-message" id="resultMsg"></div>
    
    <div class="quiz-controls">
        <button class="btn" id="nextBtn" onclick="nextQuestion()" style="display:none;">Next Question →</button>
        <button class="btn secondary" onclick="closeQuiz()">← Back to Soundboard</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
